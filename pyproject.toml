[project]
name = "toolscout"
version = "0.2.0"
description = "An ATLAS-style rollout harness on rlm-kit: a small planner progressively discovers a large MCP toolspace and computes over tool results as code, emitting reward-free trajectories + per-criterion facts for a downstream trainer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boik Su" }]
keywords = ["rlm", "dspy", "mcp", "tool-use", "agent", "reinforcement-learning", "toolspace", "atlas"]
dependencies = [
    # rlm-kit is consumed via a git source until it ships on PyPI (see [tool.uv.sources]).
    "rlm-kit",
    "pydantic>=2.0",
    # The toolspace is MCP: the ISL/ITL layer connects to external MCP servers (client-only).
    "mcp>=1.0",
]

[project.optional-dependencies]
# The opt-in rubric self-check tool (TS_ENABLE_JUDGE) and the host-side `toolscout rubric` generator
# both talk an OpenAI-compatible API via rlm-kit's make_model_tool. Off unless you enable them.
judge = ["openai>=1.0"]
observe = ["langfuse>=4.6.1", "openinference-instrumentation-dspy>=0.1.36"]
# Run planner + specialist on a Claude Pro/Max subscription (TS_ROOT_LM / TS_SUB_LM =
# `claude-agent-sdk/<id>`) via rlm-kit's `rlm_kit.ClaudeAgentLM`. Installs the Claude Agent SDK the
# adapter needs; also needs the Claude Code CLI installed + logged in — a runtime prerequisite pip
# can't express (see .env.example).
subscription = ["claude-agent-sdk>=0.1.60"]

# Bare `uv sync` (and `--all-packages`) default-installs the `subscription-sdk` dev group (below) so the
# Claude Agent SDK isn't pruned from the shared dev venv — an EXTRA is not synced by default, so a
# `uv sync` without `--extra subscription` PRUNES it and a subscription dev run then crashes (ClaudeAgentLM
# ImportError). `dev` MUST stay listed — default-groups REPLACES uv's `["dev"]` default, it doesn't append.
# The public pip extra above is unchanged. Opt out for one sync: `uv sync --no-group subscription-sdk`.
[tool.uv]
default-groups = ["dev", "subscription-sdk"]

# rlm-kit is public but not yet on PyPI, so it comes in via git (uv.lock pins the exact commit); swap to
# a version spec once it ships on PyPI. The dogfooding loop rlm-kit is designed around still holds: when
# co-developing rlm-kit locally, overlay an editable install (`uv pip install -e ../rlm-kit`) or bump
# this ref after pushing, so a fix that surfaces here can be promoted into the kit.
[tool.uv.sources]
rlm-kit = { git = "https://github.com/qazbnm456/rlm-kit.git", branch = "main" }

# The visualization console ships IN-REPO as its own package (studio/) — a uv workspace member, NOT part
# of the `toolscout` wheel. It reads this package's trace/TaskResponse contract, so co-locating keeps
# them in sync; its web stack (fastapi/uvicorn/frontend) stays behind the package boundary + the studio's
# `live` optional extra, so a harness-only install never pulls it. The external git source (rlm-kit)
# lives here at the workspace root and applies to every member.
[tool.uv.workspace]
members = ["studio", "eval"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# A dev-group MIRROR of the `subscription` optional-dependency extra (kept above for the pip surface),
# default-installed via `[tool.uv] default-groups` so a bare `uv sync` doesn't prune the Claude Agent SDK.
subscription-sdk = ["claude-agent-sdk>=0.1.60"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

# ruff's DEFAULT rule set is not a stable contract — 0.16 expanded it far past the
# pycodestyle/pyflakes baseline, which is why CI pins the version. Default rules that fight this
# project's design are ignored BY NAME here, with the reason, rather than by loosening the pin.
#
# Deliberately no `select` list: curating one is a real policy decision, and this codebase leans on
# lazy imports (keeping modules SDK-free, deferring optional extras) that a broader selection would
# immediately argue with.
#
# `BLE001` is deliberately NOT here. This project drives untrusted third-party MCP servers and must
# degrade rather than die, so a blind `except Exception` around a server's own code IS the design —
# but every such site already carries a `# noqa: BLE001` naming WHY, which is more precise than a
# blanket ignore and keeps a NEW blind catch from arriving unexamined.
[tool.ruff.lint]
ignore = [
    # Same stance for best-effort work: a live-stream teardown, a studio shutdown, or an agent's
    # cleanup touch must not raise out and mask the real error.
    "S110",
    # `__all__` is grouped by comment-delimited section, which tells a reader more than alphabetical
    # order does.
    "RUF022",
    # Would swap ValueError for TypeError at a taskset validation site. That is a PUBLIC behaviour
    # change — callers and tests catch ValueError — bought for a lint preference.
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
# Test idiom, not debt. `[x for x in xs if p(x)][0]` says "the one matching row" more plainly than
# `next(iter(...))`; a mutable class attribute on a throwaway fixture needs no `ClassVar`; a
# `subprocess.run` whose exit code the test asserts on itself does not want `check=True` (it would
# raise before the assertion that reports WHY); and `srv._private` as a bare expression IS the
# assertion — it must raise AttributeError.
#
# `S102` is the load-bearing one: `exec(PROXY_SOURCE, ns)` is how these tests verify the generated
# MCP proxy source is valid Python that behaves correctly. Executing it is the ENTIRE point of the
# test, and the source is this project's own constant, not input.
"tests/**" = ["RUF015", "RUF012", "S101", "S102", "B018", "RUF059", "SIM115", "PLW1510"]
"eval/tests/**" = ["RUF015", "RUF012", "S101", "PLW1510"]
"studio/tests/**" = ["RUF015", "RUF012", "S101", "PLW1510"]

[project.scripts]
toolscout = "toolscout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` ships every file under the package dir — the skills/*.md ride along automatically. (A
# redundant force-include of those same paths duplicates them and breaks the wheel build.)
packages = ["toolscout"]
